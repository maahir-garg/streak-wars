services:
  bot:
    build: .
    # Reads TELEGRAM_BOT_TOKEN, GROUP_CHAT_ID, USER*_* etc. from your .env file.
    env_file: .env
    # Auto-restart on crash and on host reboot. This is what makes it "always-on".
    restart: unless-stopped
    # Persist the SQLite streak state across container rebuilds/restarts.
    volumes:
      - ./data:/app/data
